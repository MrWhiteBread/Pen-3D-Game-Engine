[package]
name = "Pen_3D_Engine"
version = "0.1.0"
edition = "2024"

[profile.release]
debug = true

[dependencies]
rand = "0.10.2"
slotmap = "1.1.1"
indexmap = "2.14.0"
kiddo = "5.3.2"
image = "0.25.9"
atomic_float = "1.0"
tokio = { version = "1.38", features = ["full"] }
wgpu = "27.0.1"
env_logger = "0.11.8"
pollster = "0.4.0"
winit = "0.29.15"
bytemuck = { version = "1.4", features = ["derive"] }
once_cell = "1.21.3"
arc-swap = "1.9.1"
glam = "0.30.9"